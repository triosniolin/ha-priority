name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brands listing is a requirement of the HACS *default* store, which
          # needs a PR to home-assistant/brands. Installing this as a custom
          # repository does not require it, so the check is noise until that
          # PR lands.
          ignore: brands

  python:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt ruff
      - run: ruff check custom_components/priority
      - run: python -m pytest tests/ -q

  frontend:
    name: card logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/priority/frontend/priority-card.js
      - run: node tests/card_test.js
