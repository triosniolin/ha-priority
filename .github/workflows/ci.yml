name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The real risk is a *future* core release breaking the internals this leans
  # on, and you cannot test the future. A weekly run against whatever Home
  # Assistant is current turns that into a red build within a week of the
  # release, rather than a report from someone whose lights stopped responding.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # Brands listing is a requirement of the HACS *default* store, which
          # needs a PR to home-assistant/brands. Installing this as a custom
          # repository does not require it, so the check is noise until that
          # PR lands.
          ignore: brands

  python:
    name: ruff + pytest (current HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt ruff
      - run: python tests/shim_requirements.py | xargs -r pip install
      - run: ruff check custom_components/priority
      - run: python -m pytest tests/ -q

  minimum:
    # Proves the version floor in the manifest and README is true. Right now it
    # is the same release as `current`; it stops being redundant the moment
    # Home Assistant moves on, and it catches accidentally reaching for an API
    # newer than the declared minimum.
    name: pytest (declared minimum HA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component==0.13.355
      - run: python tests/shim_requirements.py | xargs -r pip install
      - run: python -c "import homeassistant.const as c; print('HA', c.__version__)"
      - run: python -m pytest tests/ -q

  contract:
    # The internals this integration depends on, asserted on their own. When
    # core moves, this fails with one line naming what moved, instead of the
    # behavioural suite failing eighty times for reasons that take an hour to
    # read.
    name: core internals contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-test.txt
      - run: python tests/shim_requirements.py | xargs -r pip install
      - run: python -m pytest tests/test_core_contract.py -q

  frontend:
    name: card logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/priority/frontend/priority-card.js
      - run: node tests/card_test.js

  cards-e2e:
    # card_test.js runs against a hand-rolled DOM stub: no layout, no CSS, no
    # stacking contexts, no real event dispatch. It cannot see a control that
    # renders off screen, or one covered by something else, or a card that
    # outgrows the height the dashboard gave it - and it has passed pickers
    # that were completely unusable in a browser. This job is where anything
    # about clicking, opening or positioning is actually checked.
    name: card behaviour (headless Chromium)
    runs-on: ubuntu-latest
    # Without a cap, a hung browser install burns the default six hours before
    # anyone finds out. Nothing here should take more than a couple of minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Deliberately not --with-deps. That shells out to apt-get, which hung for
      # sixteen minutes on the first run of this job, and the runner image
      # already carries what the headless shell needs. If a future image drops a
      # library, the test run below fails immediately with the missing .so
      # named, which is a better failure than a silent stall.
      - run: npx playwright install chromium
      - run: node tests/e2e_test.js
